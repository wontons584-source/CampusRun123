# Alembic 配置（T-03）
#
# 关键点：
# 1. `script_location = alembic`（相对 backend/ 目录，不能写绝对路径）。
# 2. `sqlalchemy.url` **故意留空**：URL 从 app.core.config.settings 取（env.py 里），
#    避免「.ini 里的库地址」和「应用实际连的库」两处漂移，出现"迁移跑到了另一个库"。
# 3. `%` 在 .ini 里是插值语法，URL 里若含 % 必须写成 %%；留空就没有这个坑。

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# URL 由 env.py 从 settings.database_url 注入，这里保持空值。
sqlalchemy.url =

# 迁移文件名：0001_init.py 形式（revision 号 + 描述），按 revision 字典序可读。
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

# 输出格式
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
