# CampusRun 本地编排
#
# 启动：  make up          （在 deploy/ 目录下，或 make -C deploy up）
# 迁移：  make migrate
# 停止：  make down
#
# 说明：
# 1. 所有服务共用一份环境变量锚点 x-app-env，避免 api / worker / beat 三处配置漂移
#    （漂移的典型症状：API 能连库、worker 连不上，排查半天）。
# 2. worker 与 beat 必须挂同一个镜像、同一份 env，否则会出现"迁移逻辑对但任务算错"。
# 3. postgres/redis 端口只绑 127.0.0.1，不暴露到局域网。

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-only-not-for-production}
  DATABASE_URL: postgresql+psycopg://campusrun:campusrun@postgres:5432/campusrun
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-jwt-secret-change-me}
  VERIFY_EMAIL_DOMAIN_WHITELIST: ${VERIFY_EMAIL_DOMAIN_WHITELIST:-nau.edu.cn}
  PHONE_AES_KEY: ${PHONE_AES_KEY:-}
  PICK_CODE_AES_KEY: ${PICK_CODE_AES_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}

services:
  postgres:
    image: postgres:16-alpine
    container_name: campusrun-pg
    environment:
      POSTGRES_USER: campusrun
      POSTGRES_PASSWORD: campusrun
      POSTGRES_DB: campusrun
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusrun -d campusrun"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: campusrun-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    container_name: campusrun-api
    environment:
      <<: *app-env
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    container_name: campusrun-worker
    environment:
      <<: *app-env
    command: >
      celery -A app.workers.celery_app:celery_app worker
      --loglevel=INFO --concurrency=2 --max-tasks-per-child=200
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    container_name: campusrun-beat
    environment:
      <<: *app-env
    command: >
      celery -A app.workers.celery_app:celery_app beat --loglevel=INFO
      --schedule=/tmp/celerybeat-schedule
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: campusrun-nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
