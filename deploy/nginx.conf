# 本地开发用 nginx：只做反向代理，不承担 TLS（生产由 ECS + 证书终止）
# 作用：让前端用同源 /api 访问后端，避免开发期就被 CORS 绑住。

upstream campusrun_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;      # 证件/凭证图片上限（与 FR-FULFILL-03 的 5MB 校验留余量）

    # 健康检查不走日志，避免探针刷爆 access.log
    location = /healthz {
        access_log off;
        proxy_pass http://campusrun_api;
    }

    location /api/ {
        proxy_pass http://campusrun_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # 图片/日志等静态资源后续由对象存储直出，nginx 不代理
    location / {
        return 404;
    }
}
